name: Offline Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-test dependencies
        run: python -m pip install pytest reportlab
      - name: Run deterministic tests
        run: python -m pytest tests -q
      - name: Compile sources
        run: python -m compileall -q agents.py config.py state.py graph.py mcp_client.py frontend.py weather_mcp_server.py pdf_export.py cli.py
